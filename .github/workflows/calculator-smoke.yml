name: Historical calculator safety smoke
on:
  pull_request:
    paths:
      - 'bioage/**'
      - 'tests/**'
      - '.github/workflows/calculator-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check bioage/widget.js && node --check bioage/methodology.js
      - run: node --test tests/safety-smoke.test.cjs
